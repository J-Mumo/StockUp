# StockUp production stack.
#
# Bring up:   docker compose up -d --build      # compose auto-loads .env
# Tail logs:  docker compose logs -f api worker beat
# Migrate:    handled automatically on api startup
# Backfill:   docker compose exec api python -m cli.commands backfill-prices
#
# Public ingress: TLS terminates in the shared Caddy proxy stack (~/proxy on the
# host). Caddy reaches this stack through the external `web` Docker network by
# resolving the container names `stockup-api-1` and `stockup-frontend-1`.
# Nothing here binds to a host port.

name: stockup

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-stockup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockup} -d ${POSTGRES_DB:-stockup}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    image: stockup-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockup}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host ports: the shared Caddy proxy reaches us on the `web` network.
    # For local dev / one-off debugging, uncomment:
    # ports: ["127.0.0.1:8000:8000"]
    networks:
      - default
      - web
    volumes:
      - app_data:/app/data

  frontend:
    build:
      context: ./frontend
    image: stockup-frontend:latest
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - web

  worker:
    image: stockup-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockup}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - app_data:/app/data

  beat:
    image: stockup-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockup}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A tasks.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  app_data:

networks:
  default:
  web:
    external: true
